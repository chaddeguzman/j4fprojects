<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explain It Simple — CDG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-logo">CDG</div>
    <a href="https://chaddeguzman.github.io/j4fprojects" class="nav-back">← J4F Projects</a>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="section-label">J4F — Tool 02</div>
    <h1>Explain It <em>Simple.</em></h1>
    <p>Type any tech jargon, complex term, or confusing concept — and get it explained in plain language. Two ways. Two ages.</p>
  </section>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <input
        class="term-input"
        id="termInput"
        type="text"
        placeholder="e.g. Machine Learning, REST API, Blockchain..."
        autocomplete="off"
      />
      <button class="explain-btn" id="explainBtn" onclick="explain()">Explain It ↓</button>
    </div>
    <div class="examples">
      <button class="example-chip" onclick="setExample('Machine Learning')">Machine Learning</button>
      <button class="example-chip" onclick="setExample('REST API')">REST API</button>
      <button class="example-chip" onclick="setExample('Blockchain')">Blockchain</button>
      <button class="example-chip" onclick="setExample('Cloud Computing')">Cloud Computing</button>
      <button class="example-chip" onclick="setExample('Docker')">Docker</button>
      <button class="example-chip" onclick="setExample('Recursion')">Recursion</button>
    </div>
  </div>

  <!-- Results -->
  <div class="results" id="results">
    <div class="results-term" id="resultsTerm"></div>
    <div class="cards-grid">

      <div class="explain-card">
        <div class="card-label">
          <span class="card-emoji">🧒</span>
          <span class="card-age">Age 10 — Kid</span>
        </div>
        <div class="card-text" id="kidText">
          <span class="loading">
            <span class="dots"><span></span><span></span><span></span></span>
            Thinking like a kid...
          </span>
        </div>
      </div>

      <div class="explain-card">
        <div class="card-label">
          <span class="card-emoji">🧑‍🎓</span>
          <span class="card-age">Age 15 — Teen</span>
        </div>
        <div class="card-text" id="teenText">
          <span class="loading">
            <span class="dots"><span></span><span></span><span></span></span>
            Thinking like a teen...
          </span>
        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer>© <span id="year"></span> Chad De Guzman — Just For Fun</footer>

  <script src="script.js"></script>
</body>
</html>
