<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explain It Simple - CDG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-logo">CDG</div>
    <a href="https://chaddeguzman.github.io/j4fprojects" class="nav-back">&larr; J4F Projects</a>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="section-label">J4F - Tool 02</div>
    <h1>Explain It <em>Simple.</em></h1>
    <p>Choose who the explanation is for, type any tech jargon or confusing concept, and get one clear chat tailored to that audience.</p>
  </section>

  <!-- Input -->
  <div class="input-area">
    <div class="audience-selector" aria-label="Choose explanation audience">
      <button class="audience-chip selected" type="button" data-audience="child" onclick="setAudience('child')">Child</button>
      <button class="audience-chip" type="button" data-audience="teen" onclick="setAudience('teen')">Teen</button>
      <button class="audience-chip" type="button" data-audience="adult" onclick="setAudience('adult')">Adult</button>
    </div>

    <div class="response-selector" aria-label="Choose response length">
      <button class="response-chip selected" type="button" data-mode="full" onclick="setResponseMode('full')">Full</button>
      <button class="response-chip" type="button" data-mode="tldr" onclick="setResponseMode('tldr')">TL;DR</button>
    </div>

    <div class="input-row">
      <input
        class="term-input"
        id="termInput"
        type="text"
        placeholder="e.g. Machine Learning, REST API, Blockchain..."
        autocomplete="off"
      >
      <button class="explain-btn" id="explainBtn" onclick="explain()">Explain It &darr;</button>
    </div>

    <div class="examples">
      <button class="example-chip" onclick="setExample('Machine Learning')">Machine Learning</button>
      <button class="example-chip" onclick="setExample('REST API')">REST API</button>
      <button class="example-chip" onclick="setExample('Blockchain')">Blockchain</button>
      <button class="example-chip" onclick="setExample('Cloud Computing')">Cloud Computing</button>
      <button class="example-chip" onclick="setExample('Docker')">Docker</button>
      <button class="example-chip" onclick="setExample('Recursion')">Recursion</button>
    </div>
  </div>

  <!-- Results -->
  <div class="results" id="results">
    <div class="results-header">
      <div class="results-term" id="resultsTerm"></div>
      <button class="clear-btn" id="clearBtn" onclick="clearChat()">Clear Chat</button>
    </div>

    <div class="cards-grid single-card">
      <div class="explain-card">
        <div class="card-label">
          <span class="card-age" id="audienceLabel">Child Explanation</span>
        </div>
        <div class="chat-container" id="mainChat"></div>
        <div class="chat-input-row">
          <input class="chat-input" id="chatInput" type="text" placeholder="Ask a follow-up..." autocomplete="off">
          <button class="chat-send-btn" onclick="sendChatMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>&copy; <span id="year"></span> Chad De Guzman - Just For Fun</footer>

  <script src="script.js"></script>
</body>
</html>
